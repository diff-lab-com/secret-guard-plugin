[package]
name = "secret-guard-plugin"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Shannon Contributors"]
description = "Secret-guard plugin implementing shannon-plugin-api::ContextTransform (blueprint artifact b)"
repository = "https://github.com/diff-lab-com/secret-guard-plugin"

# Blueprint: docs/research/llm-secret-redaction-research-2026-09.md §9 (artifact b).
# Thin adapter: implements the host contract (shannon-plugin-api) over the
# pure primitives (secret-guard). Policy interpretation reads the policy the
# host supplies; the pilot registry lives here (see README "registry scope").
#
# Primary sources are the repo URLs (SSH protocol); [patch] redirects them to
# sibling checkouts when present, so local three-repo development picks up
# uncommitted changes while CI and fresh clones resolve from GitHub.
#   - CI: checkouts + symlinks recreate the sibling layout (see ci.yml) —
#     cargo never fetches the git sources.
#   - Fresh clone of THIS repo alone: cargo fetches over SSH, so a GitHub
#     SSH key is required (crates.io publish in T5 removes this).
#   - shannon-plugin-api tracks shannon-agent's `dev` branch (the contract
#     crate merged 2026-09-09 via PR #85).

[dependencies]
secret-guard = { git = "ssh://git@github.com/diff-lab-com/secret-guard.git" }
shannon-plugin-api = { git = "ssh://git@github.com/diff-lab-com/shannon-agent.git", branch = "dev" }
serde_json = "1"
tracing = "0.1"

[patch."ssh://git@github.com/diff-lab-com/secret-guard.git"]
secret-guard = { path = "../secret-guard" }

[patch."ssh://git@github.com/diff-lab-com/shannon-agent.git"]
shannon-plugin-api = { path = "../shannon-plugin-api/crates/shannon-plugin-api" }
